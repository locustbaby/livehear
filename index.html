<!doctype html>
<html lang="zh-CN" data-platform="macos">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var ua = navigator.userAgent;
        var p = /Windows/i.test(ua) ? "windows" : /Mac/i.test(ua) ? "macos" : /Linux/i.test(ua) ? "linux" : "macos";
        document.documentElement.setAttribute("data-platform", p);
      })();
    </script>
    <title>LiveHear</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <!-- LiveHear 纯粹全沉浸实时同传 HUD 浮窗 -->
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
